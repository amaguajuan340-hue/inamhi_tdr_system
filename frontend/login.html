<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión TDR - INAMHI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">INAMHI</h1>
            <p class="text-sm text-gray-500">Sistema de Gestión de Inventario y TDR</p>
        </div>

        <div id="error-box" class="hidden p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded-r-lg" role="alert" style="display: none;">
            Credenciales incorrectas.
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" id="username" required autocomplete="username"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-gray-900" 
                       placeholder="Ej. tecnico1">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-gray-900" 
                       placeholder="••••••••">
            </div>

            <button type="submit" id="btn-submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors duration-200 shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 cursor-pointer">
                Ingresar al Sistema
            </button>
        </form>

        <div class="text-center">
            <p class="text-xs text-gray-400">© 2026 INAMHI - Dirección de Gestión Tecnológica</p>
        </div>
    </div>

    <script>
        // Configuración exacta al puerto 5050 del backend Python
        const LOGIN_URL = 'http://127.0.0.1:8001/api/users/login';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const errorBox = document.getElementById('error-box');
            const btnSubmit = document.getElementById('btn-submit');
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;

            // Reiniciar estado visual antes de la petición
            errorBox.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Autenticando...';

            try {
                // Enviamos los datos estructurados como un objeto JSON nativo
                const response = await fetch(LOGIN_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Almacenamiento seguro del token y datos estructurados mapeando la clave 'user' interna
                    localStorage.setItem('token', data.access_token || data.token);
                    localStorage.setItem('access_token', data.access_token || data.token);
                    localStorage.setItem('user_role', (data.user && data.user.role) || data.role || 'tecnico'); 
                    localStorage.setItem('user_name', (data.user && data.user.nombre_completo) || data.full_name || usernameInput);

                    // Redirección directa al panel de control
                    window.location.href = 'index.html';
                } else {
                    const errorData = await response.json();
                    
                    // Procesador inteligente de respuestas de error de FastAPI
                    if (errorData.detail) {
                        if (Array.isArray(errorData.detail)) {
                            errorBox.innerText = errorData.detail.map(err => `${err.loc[1] || err.loc[0]}: ${err.msg}`).join(', ');
                        } else {
                            errorBox.innerText = errorData.detail;
                        }
                    } else {
                        errorBox.innerText = 'Credenciales incorrectas o usuario no encontrado.';
                    }
                    errorBox.style.display = 'block';
                }
            } catch (error) {
                errorBox.innerText = 'Error crítico: No se pudo conectar con el servidor backend.';
                errorBox.style.display = 'block';
                console.error("Error en Fetch:", error);
            } finally {
                // Devolver el botón a su estado normal
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Ingresar al Sistema';
            }
        });
    </script>
</body>
</html>
